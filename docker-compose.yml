services:
  db:
    image: mysql:8.0
    container_name: list-save-db
    command: --lower-case-table-names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-listandsave_root_pwd}
      MYSQL_DATABASE: list_save
      MYSQL_USER: ${DB_USER:-listandsave}
      MYSQL_PASSWORD: ${DB_PASSWORD:-listandsave_pwd}
    ports:
      - "${DB_PORT_MAP:-13306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - list-save-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: list-save-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pwd}
    networks:
      - list-save-network
    restart: unless-stopped

  app:
    build: .
    container_name: list-save-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-listandsave}
      DB_PASSWORD: ${DB_PASSWORD:-listandsave_pwd}
      DB_NAME: list_save
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: 24h
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pwd}
    ports:
      - "${APP_PORT_MAP:-3020}:3000"
    networks:
      - list-save-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>{r.on('data',()=>{});r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 50s
      retries: 5

volumes:
  db_data:
    driver: local

networks:
  list-save-network:
    driver: bridge