<!DOCTYPE html>
<html lang="es" data-umami-id="084adb18-3e66-41fb-bbf6-d6fd0d0eca81" data-umami-src="https://cloud.umami.is/script.js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accede a tu cuenta - List &amp; Save</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="084adb18-3e66-41fb-bbf6-d6fd0d0eca81"></script>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="/" class="header__logo" aria-label="List &amp; Save — Inicio">
                <img src="assets/images/logo.svg" alt="List &amp; Save" class="header__logo-img">
            </a>
            <a href="/" class="button button--secondary">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
            </a>
        </div>
    </header>

    <main class="main" id="main-content">
        <div class="form-container animate-fadeIn">
            <form class="form form--login" id="login-form" novalidate>
                <div class="form__brand">
                    <img src="assets/images/logo.svg" alt="" aria-hidden="true" class="form__brand-logo">
                    <h1 class="form__title">Accede a tu cuenta</h1>
                    <p class="form__subtitle">Gestiona tus listas y compara precios</p>
                </div>

                <div class="form__group">
                    <label class="form__label" for="login-email">
                        <i class="fas fa-envelope" aria-hidden="true"></i> Correo electrónico
                    </label>
                    <input type="email" id="login-email" name="email" class="form__input"
                           placeholder="tu@correo.com" required autocomplete="email"
                           aria-describedby="email-error">
                    <span class="form__error" id="email-error" role="alert"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="login-password">
                        <i class="fas fa-lock" aria-hidden="true"></i> Contraseña
                    </label>
                    <div class="form__input-wrap">
                        <input type="password" id="login-password" name="password" class="form__input"
                               required autocomplete="current-password"
                               aria-describedby="password-error">
                        <button type="button" class="form__toggle-pw" id="toggle-pw"
                                aria-label="Mostrar u ocultar contraseña">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="form__error" id="password-error" role="alert"></span>
                </div>

                <div class="form__group form__group--checkbox">
                    <input type="checkbox" id="remember" name="remember" class="form__checkbox">
                    <label for="remember" class="form__label--checkbox">Mantener sesión activa</label>
                </div>

                <button type="submit" class="button button--primary button--full button--lg">
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Entrar
                </button>

                <button type="button" id="btn-demo" class="button button--secondary button--full" style="margin-top:.5rem;opacity:.85;">
                    <i class="fas fa-play-circle" aria-hidden="true"></i> Acceso demo rápido
                </button>

                <p class="form__footer">
                    ¿Primera vez aquí?&nbsp;<a href="register.html" class="form__link">Crear cuenta nueva</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/fab-global.js"></script>
    <script src="js/login.js"></script>
    <script>
        // Toggle mostrar/ocultar contraseña
        document.getElementById("toggle-pw").addEventListener("click", function () {
            var input = document.getElementById("login-password");
            var icon  = this.querySelector("i");
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fas fa-eye-slash";
                this.setAttribute("aria-label", "Ocultar contraseña");
            } else {
                input.type = "password";
                icon.className = "fas fa-eye";
                this.setAttribute("aria-label", "Mostrar contraseña");
            }
        });

        // Demo rápido
        document.getElementById("btn-demo").addEventListener("click", function () {
            document.getElementById("login-email").value    = "admin@listandsave.com";
            document.getElementById("login-password").value = "Admin1234";
            document.querySelector("button[type='submit']").click();
        });
    </script>
    <script src="js/demo.js"></script>
</body>
</html>
