  </g>
  <!-- Texto "List" -->
  <text x="52" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" letter-spacing="-0.5">List</text>
  <!-- Ampersand -->
  <text x="98" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b">&amp;</text>
  <!-- Texto "Save" -->
