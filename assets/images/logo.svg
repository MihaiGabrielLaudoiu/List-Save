    <path d="M2 2h4l5 22h18l4-16H9" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Ruedas -->
    <circle cx="16" cy="28" r="2.2" fill="#1e40af"/>
    <circle cx="28" cy="28" r="2.2" fill="#1e40af"/>
    <!-- Check encima -->
